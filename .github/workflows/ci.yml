name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sales_dashboard
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/sales_dashboard
      JWT_SECRET: ci-only-sales-team-platform-session-secret-0123456789abcdef0123456789abcdef0123456789abcdef01234
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm drizzle-kit migrate
      - name: Type check
        run: pnpm check
      - name: Start server for runtime readiness tests
        run: |
          NODE_ENV=development PORT=3000 pnpm exec tsx server/_core/index.ts > /tmp/sales-team-platform-server.log 2>&1 &
          echo $! > /tmp/sales-team-platform-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null && curl --fail --silent http://127.0.0.1:3000/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sales-team-platform-server.log
          exit 1
      - name: Test
        run: pnpm test
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/sales-team-platform-server.pid ]; then
            kill "$(cat /tmp/sales-team-platform-server.pid)" || true
          fi
      - name: Production build
        run: pnpm build
